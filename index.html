<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>p5.js 과제 포트폴리오</title> <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: center; 
      align-items: center;     
      min-height: 100vh;
      background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%); 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #2c3e50;
    }

    .header-text {
      text-align: center;
      margin-bottom: 40px;
    }

    .header-text h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
    }

   
    .header-text p {
      font-size: 1.1rem;
      color: #7f8c8d;
      margin-top: 10px;
    }

    #projects {
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: 100%;
      max-width: 800px;
      gap: 30px;
    }

    #projects .cell {
      aspect-ratio: 16 / 9;
      position: relative;
      overflow: hidden;
      background-color: #ffffff;
      border: none;
      border-radius: 16px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }

    #projects .cell:hover {
      transform: translateY(-8px); 
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
    }

    #projects .cell iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 600px;
      height: 400px;
      border: none;
      transform-origin: top left;
      transform: scale(0.5);
    }
  </style>
</head>
<body>

  <div class="header-text">
    <h1>p5.js 과제 최종 제출</h1>
    <p>20253014 송제언</p>
  </div>

  <main id="projects">
    <div class="cell">
      <iframe src="work1/index.html"></iframe>
    </div>
    <div class="cell">
      <iframe src="work4/index.html"></iframe>
    </div>
    <div class="cell">
      <iframe src="work2/index.html"></iframe>
    </div>
    <div class="cell">
      <iframe src="work3/index.html"></iframe>
    </div>
  </main>

</body>
</html>
