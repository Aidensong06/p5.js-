<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>p5.js 포트폴리오</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%); 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #2c3e50;
      padding: 50px 24px;
    }

    .header-text {
      text-align: center;
      margin-bottom: 40px;
    }

    .header-text h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
    }

    .header-text p {
      font-size: 1.1rem;
      color: #7f8c8d;
      margin-top: 10px;
    }

    #projects {
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: 100%;
      max-width: 900px;   
      gap: 30px;
    }

    #projects .cell {
      display: flex;
      flex-direction: column;
      background-color: #ffffff;
      border: none;
      border-radius: 16px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
      overflow: hidden;
    }

    #projects .cell:hover {
      transform: translateY(-8px); 
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
    }
    .canvas-box {
      aspect-ratio: 3 / 2;
      position: relative;
      background-color: #f8f9fa; 
    }

    .canvas-box iframe {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 600px;
      height: 400px;
      border: none;
      transform: translate(-50%, -50%) scale(0.65);
    }

    
    .text-box {
      padding: 15px 20px;
      text-align: center;
      border-top: 1px solid #eeeeee; 
    }

    .text-box h3 {
      font-size: 1.05rem;
      color: #2c3e50;
      margin-bottom: 6px;
    }

    .text-box p {
      font-size: 0.9rem;
      color: #7f8c8d;
    }
  </style>
</head>
<body>

  <div class="header-text">
    <h1>p5.js 최종 과제 제출</h1>
    <p>20253014 송제언</p>
  </div>

  <main id="projects">
    <div class="cell">
      <div class="canvas-box">
        <iframe src="work1/index.html"></iframe>
      </div>
      <div class="text-box">
        <h3>과제 1: 추상화 그리기</h3>
        
      </div>
    </div>

    <div class="cell">
      <div class="canvas-box">
        <iframe src="work4/index.html"></iframe>
      </div>
      <div class="text-box">
        <h3>과제 4: 추상화에 움직임 넣기</h3>
        
      </div>
    </div>

    <div class="cell">
      <div class="canvas-box">
        <iframe src="work2/index.html"></iframe>
      </div>
      <div class="text-box">
        <h3>과제 2: 캐릭터 그리기</h3>
        
      </div>
    </div>

    <div class="cell">
      <div class="canvas-box">
        <iframe src="work3/index.html"></iframe>
      </div>
      <div class="text-box">
        <h3>과제 3: 움직이는 캐릭터 그리기</h3>

      </div>
    </div>
  </main>

</body>
</html>
